# dsh-two-stage-promotion bundle patch: inserts the host plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the host half (exports ".") runs
# in the host process and syncs the bundled 二阶段晋升模式 preset into
# ~/.dsh/.agent-presets/two-stage-promotion on startup. No browser half.
- insert:
    - id: two-stage-promotion
      name: 'dsh-two-stage-promotion'
